<section id="contact">
  <h2 fadeOnScroll>Ponte en <span class="grad">contacto</span></h2>
  <div class="grid">
    <a fadeOnScroll class="card" [href]="'mailto:' + cv.email" (click)="mail($event)">✉️ <b>Email</b><br>{{ cv.email }}</a>
    <a fadeOnScroll class="card" [href]="'tel:+57' + cv.phone.replaceAll(' ', '')">📱 <b>Teléfono</b><br>{{ cv.phone }}</a>
    <a fadeOnScroll class="card" [href]="cv.github" target="_blank">🐙 <b>GitHub</b><br>Pater9730</a>
    <a fadeOnScroll class="card" [href]="cv.linkedin" target="_blank">💼 <b>LinkedIn</b><br>arnovil-paternina</a>
  </div>
</section>
